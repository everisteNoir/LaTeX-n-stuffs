<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LaTeX Style Guide — rules, macros, templates</title>
<meta name="description" content="82 LaTeX writing rules with Don't/Do comparisons, a mymath macro pack and 17 document templates. Searchable, with per-file copy and download.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2308090B'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' fill='%23E4B36B' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
<script>
  /* Apply the saved theme before first paint so light mode never flashes dark. */
  try {
    var saved = JSON.parse(localStorage.getItem('latexGuide.v2') || '{}');
    if (saved.theme === 'light') document.documentElement.classList.remove('dark');
    if (typeof saved.rail === 'number') {
      var cap = Math.min(520, Math.max(336, Math.round(innerWidth * 0.42)));
      document.documentElement.style.setProperty('--rail-w', Math.max(216, Math.min(cap, saved.rail)) + 'px');
    }
  } catch (e) {}
</script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      colors: { bg:'var(--bg)', bg2:'var(--bg-2)', surface:'var(--surface)', line:'var(--line)', line2:'var(--line-2)', fg:'var(--fg)', mut:'var(--mut)', faint:'var(--faint)', accent:'var(--accent)', accent2:'var(--accent-2)', dont:'var(--dont)', code:'var(--code)' },
      fontFamily: { sans:['Inter','system-ui','sans-serif'], serif:['Newsreader','Georgia','serif'], mono:['JetBrains Mono','ui-monospace','monospace'] }
    } }
  };
</script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.48.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap" rel="stylesheet">
<style>
/* ============================================================
   1. TOKENS
   ============================================================ */
:root{
  --bg:#F7F5F1; --bg-2:#FFFFFF; --surface:#FFFFFF;
  --line:#E3DED5; --line-2:#D2CCC1;
  --fg:#15171B; --mut:#5E6167; --faint:#8A857D;
  --accent:#8C2F39; --accent-2:#A83B45; --accent-ink:#FBF8F3;
  --dont:#A33A34; --code:#FBF9F5; --tint:rgba(140,47,57,.045);
  --amb-a:rgba(140,47,57,.13); --amb-b:rgba(31,42,68,.09);
  --ring:rgba(140,47,57,.28); --grain:.018;
  --seg-bg:rgba(31,42,68,.055); --seg-knob:#FFFFFF;
  --seg-shadow:0 1px 2px rgba(25,20,15,.14),0 0 0 .5px rgba(25,20,15,.05);
  --spring:cubic-bezier(.32,.72,0,1);
  --bar-h:56px; --rail-w:clamp(236px,21vw,304px); --pad-x:clamp(16px,2.1vw,32px);
  --r-1:5px; --r-2:8px; --r-3:10px;
  --ease:cubic-bezier(.16,1,.3,1);
  --sh-1:0 18px 44px -22px rgba(30,25,20,.35);
  --sh-2:0 28px 70px -28px rgba(20,16,12,.55);
  --glass:rgba(247,245,241,.78);
  --inset:rgba(255,255,255,.6);
}
.dark{
  --bg:#08090B; --bg-2:#0C0E11; --surface:#111318;
  --line:#21242B; --line-2:#2E323B;
  --fg:#EDEAE4; --mut:#9C978E; --faint:#6C6862;
  --accent:#E4B36B; --accent-2:#F3D09B; --accent-ink:#16110A;
  --dont:#C4645A; --code:#0A0B0D; --tint:rgba(228,179,107,.06);
  --amb-a:rgba(228,179,107,.13); --amb-b:rgba(92,118,168,.10);
  --ring:rgba(228,179,107,.4); --grain:.03;
  --seg-bg:rgba(255,255,255,.05); --seg-knob:linear-gradient(180deg,#353B47,#292E38);
  --seg-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 6px -2px rgba(0,0,0,.7);
  --sh-1:0 18px 44px -22px rgba(0,0,0,.8);
  --sh-2:0 28px 70px -28px rgba(0,0,0,.9);
  --glass:rgba(9,10,13,.72);
  --inset:rgba(255,255,255,.05);
}

/* ============================================================
   2. BASE
   ============================================================ */
html{-webkit-text-size-adjust:100%;overflow-x:hidden;max-width:100%}
body.app{
  margin:0; background:var(--bg); color:var(--fg); max-width:100%;
  font:400 14px/1.55 Inter,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100dvh;
}
body.app *{scrollbar-width:thin; scrollbar-color:var(--line-2) transparent}
body.app ::-webkit-scrollbar{width:10px;height:10px}
body.app ::-webkit-scrollbar-track{background:transparent}
body.app ::-webkit-scrollbar-thumb{background:var(--line-2);border:3px solid transparent;background-clip:content-box;border-radius:99px}
body.app ::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
body.app ::selection{background:rgba(228,179,107,.28);color:var(--fg)}
.serif{font-family:Newsreader,Georgia,serif;font-weight:400}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.meta{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.01em;color:var(--faint)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:fixed;top:8px;left:8px;z-index:90;transform:translateY(-200%);background:var(--surface);color:var(--fg);
  border:1px solid var(--line-2);border-radius:var(--r-1);padding:8px 12px;font-size:13px;transition:transform .18s var(--ease)}
.skip:focus{transform:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}

/* ============================================================
   3. AMBIENT — bloom + grain + progress
   ============================================================ */
#ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bloom{position:absolute;display:block;border-radius:50%;will-change:transform}
.bloom.a{width:56vw;height:56vw;left:-14vw;top:-20vw;
  background:radial-gradient(circle at 50% 50%,var(--amb-a),transparent 62%);
  animation:drift-a 52s var(--ease) infinite alternate}
.bloom.b{width:46vw;height:46vw;right:-12vw;bottom:-22vw;
  background:radial-gradient(circle at 50% 50%,var(--amb-b),transparent 64%);
  animation:drift-b 64s var(--ease) infinite alternate}
@keyframes drift-a{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(9vw,7vh,0) scale(1.16)}}
@keyframes drift-b{from{transform:translate3d(0,0,0) scale(1.06)}to{transform:translate3d(-8vw,-6vh,0) scale(.9)}}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:var(--grain);mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  background-size:140px 140px}
.progress{position:fixed;top:0;left:0;right:0;height:1px;z-index:60;pointer-events:none}
.progress i{display:block;height:1px;background:linear-gradient(90deg,var(--accent),var(--accent-2));
  transform:scaleX(var(--p,0));transform-origin:0 50%;opacity:.85}

/* ============================================================
   4. COMMAND BAR
   ============================================================ */
#bar{position:fixed;top:0;left:0;right:0;height:var(--bar-h);z-index:40;display:flex;align-items:center;gap:12px;
  padding:0 14px 0 16px;background:var(--glass);border-bottom:1px solid var(--line);
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
  box-shadow:inset 0 1px 0 var(--inset)}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap;flex:none;padding:4px 2px;border-radius:var(--r-1)}
.brand b{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:20px;letter-spacing:-.015em;line-height:1}
.brand span{color:var(--faint);font-size:11.5px;letter-spacing:.02em}
.search{position:relative;flex:1 1 0;min-width:0;max-width:600px;display:flex;align-items:center;gap:9px;height:34px;
  padding:0 8px 0 10px;border:1px solid var(--line);border-radius:var(--r-1);background:var(--bg-2);
  transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
.search:hover{border-color:var(--line-2)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.search > i{font-size:15px;color:var(--faint);flex:none}
/* flex-basis 0 (not auto): the input's UA default size=20 width would otherwise
   become a floor, overflow the bar and push the theme button off-screen. */
.search input{flex:1 1 0;min-width:0;background:none;border:0;outline:0;color:var(--fg);
  font:400 13px/1.4 Inter,sans-serif}
.search input::placeholder{color:var(--faint)}
.search input::-webkit-search-cancel-button{display:none}
.search kbd{flex:none;font:500 10px/1 'JetBrains Mono',monospace;color:var(--faint);border:1px solid var(--line);
  border-radius:4px;padding:4px 5px;background:var(--bg)}
.bar-end{display:flex;align-items:center;gap:4px;flex:none;margin-left:auto}
.scope{display:none;font:500 10.5px/1 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent);padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--tint)}
@media (min-width:900px){.scope{display:inline-block}}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex:none;
  border:1px solid transparent;border-radius:var(--r-1);color:var(--mut);transition:color .15s,background .15s,transform .12s var(--ease)}
.icon-btn:hover{color:var(--fg);background:var(--tint);border-color:var(--line)}
.icon-btn:active{transform:scale(.95)}
.icon-btn i{font-size:17px}
.only-mobile{display:inline-flex}
@media (min-width:900px){.only-mobile{display:none}}

/* ============================================================
   5. SEARCH PANEL
   ============================================================ */
.sp{position:fixed;top:calc(var(--bar-h) + 8px);left:50%;transform:translateX(-50%);
  width:min(760px,calc(100vw - 24px));max-height:min(72vh,600px);overflow:auto;z-index:45;
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-3);padding:6px;
  box-shadow:var(--sh-2),inset 0 1px 0 var(--inset);
  animation:pop .16s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translate(-50%,-4px)}to{opacity:1;transform:translate(-50%,0)}}
.sp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 10px 8px;
  font:500 10.5px/1 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.sp-group{display:flex;align-items:center;gap:8px;padding:10px 10px 5px;font:500 10.5px/1 'JetBrains Mono',monospace;
  letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.sp-group .line{flex:1;height:1px;background:var(--line)}
.sp-item{display:grid;grid-template-columns:74px minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:8px 10px;border-radius:var(--r-1);cursor:pointer;border:1px solid transparent;text-align:left;width:100%}
.sp-item .kind{font:500 10px/1 'JetBrains Mono',monospace;letter-spacing:.04em;color:var(--faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-item .t{font-size:13px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-item .w{font:11px/1 'JetBrains Mono',monospace;color:var(--faint);white-space:nowrap}
.sp-item[aria-selected="true"]{background:var(--tint);border-color:var(--line-2)}
.sp-item[aria-selected="true"] .kind,.sp-item[aria-selected="true"] .w{color:var(--accent)}
.sp-empty{padding:22px 12px;text-align:center;color:var(--mut);font-size:13px}
.sp-foot{display:flex;gap:14px;padding:8px 10px 4px;border-top:1px solid var(--line);margin-top:6px;
  font:11px/1.4 'JetBrains Mono',monospace;color:var(--faint)}
mark{background:rgba(228,179,107,.28);color:var(--fg);border-radius:2px;padding:0 1px}
:root:not(.dark) mark{background:rgba(140,47,57,.16)}

/* ============================================================
   6. SHELL + RAIL
   ============================================================ */
#shell{position:relative;z-index:2;display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);
  padding-top:var(--bar-h);min-height:100dvh}
#rail{position:sticky;top:var(--bar-h);align-self:start;height:calc(100dvh - var(--bar-h));
  overflow-y:auto;overflow-x:hidden;
  padding:14px 12px 40px;border-right:1px solid var(--line);
  background:linear-gradient(180deg,var(--bg-2),var(--bg) 65%)}
.res-list{display:flex;flex-direction:column;gap:1px;margin-bottom:12px}
.res{position:relative;display:flex;align-items:center;gap:10px;height:34px;padding:0 9px;border-radius:var(--r-1);
  font-size:13.5px;color:var(--mut);overflow:hidden;transition:color .16s var(--ease)}
.res::before{content:'';position:absolute;inset:0;background:var(--tint);transform:scaleX(0);
  transform-origin:0 50%;transition:transform .22s var(--ease)}
.res>*{position:relative}
.res:hover{color:var(--fg)} .res:hover::before{transform:scaleX(1)}
.res[aria-current="page"]{color:var(--fg);font-weight:500}
.res[aria-current="page"]::before{transform:scaleX(1);box-shadow:inset 0 0 0 1px var(--line)}
.res i{font-size:16px;color:var(--faint);transition:color .16s}
.res[aria-current="page"] i,.res:hover i{color:var(--accent)}
.res .n{margin-left:auto;font:500 10.5px/1 'JetBrains Mono',monospace;color:var(--faint)}
.rail-sep{height:1px;background:var(--line);margin:12px 6px 10px;border:0}
.rail-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 9px 8px;
  font:500 10px/1 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.rail-h b{font-weight:500;color:var(--mut)}
.rail-filters{display:flex;flex-direction:column;gap:8px;padding:2px 2px 12px}
.fl{display:grid;grid-template-columns:52px minmax(0,1fr);align-items:center;gap:8px;font-size:11.5px;color:var(--faint)}
.fl select{height:30px;font-size:12.5px}
.idx{display:flex;flex-direction:column;gap:1px}
.grp{position:relative;display:flex;align-items:center;gap:8px;min-height:32px;padding:5px 9px;border-radius:var(--r-1);
  font-size:13px;line-height:1.3;color:var(--mut);text-align:left;width:100%;overflow:hidden;transition:color .16s var(--ease)}
.grp::before{content:'';position:absolute;inset:0;background:var(--tint);transform:scaleX(0);
  transform-origin:0 50%;transition:transform .22s var(--ease)}
.grp>*{position:relative}
.grp:hover{color:var(--fg)} .grp:hover::before{transform:scaleX(1)}
.grp[aria-current="true"]{color:var(--fg);font-weight:500}
.grp[aria-current="true"]::before{transform:scaleX(1);box-shadow:inset 0 0 0 1px var(--line)}
.grp .n{margin-left:auto;font:400 10.5px/1 'JetBrains Mono',monospace;color:var(--faint);padding-left:6px}
.grp[aria-current="true"] .n{color:var(--accent)}
.grp .sub{font:10.5px/1 'JetBrains Mono',monospace;color:var(--faint)}
.grp.sm{font-size:12px;line-height:1.35;padding:6px 9px;align-items:flex-start;gap:6px}
.fl.inl{grid-template-columns:auto auto;width:auto;gap:6px}
.dot-sep{display:inline-block;flex:none}

/* Resizable rail: the handle rides the rail's right border without taking a
   grid track of its own, so the layout stays exactly as it was by default. */
#grip{position:fixed;top:var(--bar-h);left:min(calc(var(--rail-w) - 7px),calc(100vw - 14px));width:14px;
  height:calc(100dvh - var(--bar-h));z-index:39;display:flex;align-items:center;justify-content:center;
  cursor:col-resize;touch-action:none;background:none;border:0;padding:0;outline-offset:0;
  -webkit-tap-highlight-color:transparent}
#grip::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);
  background:transparent;transition:background .18s var(--ease),box-shadow .18s var(--ease)}
#grip:hover::before{background:var(--line-2)}
#grip:focus-visible{outline:0}
#grip:focus-visible::before,#grip.live::before{background:var(--accent);box-shadow:0 0 18px -2px var(--ring)}
#grip .pips{position:relative;display:grid;grid-template-columns:repeat(2,2px);gap:3px;padding:7px 5px;
  border-radius:99px;background:var(--surface);border:1px solid var(--line-2);
  box-shadow:var(--sh-1),inset 0 1px 0 var(--inset);opacity:0;transform:scale(.86);
  transition:opacity .18s var(--ease),transform .18s var(--ease),border-color .18s var(--ease);pointer-events:none}
#grip .pips i{width:2px;height:2px;border-radius:50%;background:var(--faint);
  transition:background .18s var(--ease)}
#grip:hover .pips,#grip:focus-visible .pips,#grip.live .pips{opacity:1;transform:none}
#grip:focus-visible .pips{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring),var(--sh-1)}
#grip.live .pips{border-color:var(--accent);box-shadow:0 0 0 3px var(--tint),var(--sh-1)}
#grip.live .pips i{background:var(--accent)}
#grip .wid{position:absolute;top:14px;left:0;transform:translateX(-100%);margin-left:-1px;
  font:500 10.5px/1 'JetBrains Mono',monospace;color:var(--accent);background:var(--surface);
  border:1px solid var(--line-2);border-radius:var(--r-1);padding:5px 6px;white-space:nowrap;
  opacity:0;transition:opacity .14s var(--ease);pointer-events:none;box-shadow:var(--sh-1)}
#grip.live .wid{opacity:1}
body.resizing{cursor:col-resize;user-select:none;-webkit-user-select:none}
body.resizing #rail,body.resizing #pane{pointer-events:none}

/* ============================================================
   7. MAIN PANE + TYPE
   ============================================================ */
#pane{min-width:0;width:100%;max-width:1240px;margin:0 auto;padding:22px var(--pad-x) 104px;outline:none}
.page-h{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;padding-bottom:14px}
.page-h h1,.page-h h2{font-family:Newsreader,Georgia,serif;font-weight:400;margin:0;
  font-size:clamp(26px,2.6vw,34px);line-height:1.12;letter-spacing:-.02em;color:var(--fg)}
.page-h .count{margin-left:auto;font:400 11.5px/1 'JetBrains Mono',monospace;color:var(--faint);padding-bottom:6px}
.hint{font-size:13px;color:var(--mut);margin:0;max-width:68ch}
.hint + .hint{margin-top:4px}
.pane-block{padding-top:6px}
.rule-note{border:1px solid var(--line);border-radius:var(--r-2);padding:12px 14px;background:var(--bg-2);
  font-size:13px;color:var(--mut);margin:0 0 18px;display:flex;gap:10px;align-items:flex-start}
.rule-note i{color:var(--accent);font-size:16px;margin-top:1px}
.rule-note code{font:12px 'JetBrains Mono',monospace;color:var(--fg);background:var(--code);padding:1px 4px;border-radius:3px}

/* ============================================================
   8. CONTROLS
   ============================================================ */
.btn{display:inline-flex;align-items:center;gap:6px;height:29px;padding:0 9px;border:1px solid var(--line);
  border-radius:var(--r-1);background:var(--bg-2);color:var(--fg);font-size:12.5px;line-height:1;
  transition:background .15s,border-color .15s,color .15s,transform .12s var(--ease);white-space:nowrap}
.btn:hover{background:var(--surface);border-color:var(--line-2)}
.btn:active{transform:translateY(1px)}
.btn i{font-size:14px;color:var(--mut);transition:color .15s}
.btn:hover i{color:var(--accent)}
.btn.good{border-color:var(--accent);color:var(--accent);background:var(--tint)}
.btn.good i{color:var(--accent)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.solid i{color:var(--accent-ink)}
.btn.solid:hover{background:var(--accent-2);border-color:var(--accent-2)}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
select{appearance:none;-webkit-appearance:none;height:30px;padding:0 24px 0 8px;border:1px solid var(--line);
  border-radius:var(--r-1);background:var(--bg-2);color:var(--fg);font-size:12.5px;cursor:pointer;width:100%;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 3.5 5 6.5 8 3.5' fill='none' stroke='%239C978E' stroke-width='1.3' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 7px center;transition:border-color .15s}
select:hover{border-color:var(--line-2)}
select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.btn.zip{height:32px;padding:0 14px;border-radius:99px;background:var(--seg-knob);border:1px solid var(--line);
  box-shadow:var(--seg-shadow);margin-left:auto}

/* ============================================================
   13. TOAST + MENU SCRIM
   ============================================================ */
#toast{position:fixed;left:50%;bottom:26px;z-index:70;transform:translate(-50%,10px);opacity:0;pointer-events:none;

const G_BODY=r`1. Inline math: $...$. Display math: $$ on its own lines, formula indented 2 spaces, no blank line around or inside. Never \( \) or \[ \].

3. Text: one paragraph on one line. A new paragraph is one blank line, used sparingly.
4. Never break a line mid-sentence or around inline math.
5. Anything numbered uses enumerate (labels (a), or (i) inside theorem-like environments, set automatically). Bullets use itemize.
6. Reference equations with \eqref (two: "\eqref{a} and \eqref{b}"; more than two: separated by commas, or \cref{a,b,c}). Use \cref / \Cref for an equation only when the word "Equation" must appear, e.g. at the start of a sentence. Reference everything else with \cref / \Cref, never "Theorem~\ref". Put \label only on things that are cited.

function buildArticle(l,e){
  const v=vi(l),x=e=='xe',lg=v?'vietnamese':'english',n=N[l];
  const E=[['theorem','thm'],['lemma','lem'],['proposition','prop'],['corollary','cor'],['definition','defi'],['example','ex'],['remark','rem']];
  const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
  const pl=w=>v?w:(w.endsWith('y')?w.slice(0,-1)+'ies':w+'s');
  const nt=i=>i==0?r`\newtheorem{theorem}{${n.thm}}`:r`\newtheorem{${E[i][0]}}[theorem]{${n[E[i][1]]}}`;
  let s=r`\documentclass[12pt,a4paper]{article}`+'\n';
  s+=x?r`\usepackage{fontspec}`+'\n'+r`\setmainfont{${v?'Times New Roman':'Latin Modern Roman'}}`+'\n'+r`\usepackage[${lg}]{babel}`
      :r`\usepackage[${v?'T5':'T1'}]{fontenc}`+'\n'+r`\usepackage[utf8]{inputenc}`+'\n'+r`\usepackage[${lg}]{babel}`;
  s+='\n'+r`\usepackage{amsmath,amssymb,amsthm,enumitem,etoolbox}`+'\n'+r`\usepackage{hyperref}`+'\n'+r`\usepackage[capitalize,nameinlink]{cleveref} % last`+'\n\n';
  s+=r`\theoremstyle{plain}`+'\n'+[0,1,2,3].map(nt).join('\n')+'\n'+r`\theoremstyle{definition}`+'\n'+nt(4)+'\n'+nt(5)+'\n'+r`\theoremstyle{remark}`+'\n'+nt(6)+'\n'+r`\numberwithin{theorem}{section}`+'\n'+r`\numberwithin{equation}{section}`+'\n';
  if(v){
    const cd=(k,w,p)=>r`\crefname{${k}}{${cap(w)}}{${cap(p)}}\Crefname{${k}}{${cap(w)}}{${cap(p)}}`;
    s+=E.map(a=>{const w=n[a[1]].toLowerCase();return cd(a[0],w,pl(w))}).join('\n')+'\n'+[['section','mục'],['subsection','mục'],['equation','công thức'],['figure','hình'],['table','bảng']].map(a=>cd(a[0],a[1],a[1])).join('\n')+'\n';
  }
  s+='\n'+r`\setlist[enumerate,1]{label=(\alph*)}
\setlist[enumerate,2]{label=(\roman*)}

\author{${T2(l,'Tác giả','Author')}}

<script>
/* ============================================================

(function () {

  var panelHits = [];

  var pending = null;
  var drawerOpen = false;
  var lastGroup = null;
  var macroAnimated = false;

  var $ = function (id) { return document.getElementById(id); };
  var put = function (t) { store.push(t); return store.length - 1; };
  var reduceMotion = function () { return matchMedia('(prefers-reduced-motion: reduce)').matches; };

  /* ---------- persistence ---------- */
  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        theme: state.theme, done: Array.from(state.done), rail: state.rail,
        mode: state.mode, level: state.level, tt: state.tt, te: state.te, tl: state.tl, min: state.min,

  /* ---------- resizable rail ----------
     The rail keeps its own grid track (var(--rail-w)); the handle is a fixed
     strip sitting on that track's right edge, so resizing only changes one
     variable and the pane reflows into whatever is left. */
  var grip = $('grip'), railEl = $('rail');
  var RAIL_MIN = 216, RAIL_HARD = 520;
  var gripPill = grip.querySelector('.wid'), railDrag = null;

  function railMax() {
    return Math.max(RAIL_MIN + 120, Math.min(RAIL_HARD, Math.round(innerWidth * 0.42)));
  }
  function railWidth() { return Math.round(railEl.getBoundingClientRect().width); }
  function paintRail() {
    var w = railWidth();
    grip.setAttribute('aria-valuenow', w);
    grip.setAttribute('aria-valuemax', railMax());
    if (gripPill) gripPill.textContent = w + ' px';
    return w;
  }
  function setRail(px, save) {
    var v = Math.round(Math.min(railMax(), Math.max(RAIL_MIN, px)));
    document.documentElement.style.setProperty('--rail-w', v + 'px');
    state.rail = v;
    paintRail();
    if (save) persist();
    return v;
  }
  function resetRail() {
    document.documentElement.style.removeProperty('--rail-w');
    state.rail = null;
    paintRail();
    persist();
  }
  function endRailDrag(e) {
    if (!railDrag) return;
    if (e && e.pointerId != null && e.pointerId !== railDrag.id) return;
    railDrag = null;
    document.body.classList.remove('resizing');
    grip.classList.remove('live');
    persist();
  }

  grip.addEventListener('pointerdown', function (e) {
    if (e.button > 0 || innerWidth < 900) return;
    e.preventDefault();
    railDrag = { id: e.pointerId, x: e.clientX, w: railWidth(), lx: e.clientX, raf: 0 };
    try { grip.setPointerCapture(e.pointerId); } catch (_) {}
    grip.classList.add('live');
    document.body.classList.add('resizing');

  grip.addEventListener('pointermove', function (e) {
    if (!railDrag || e.pointerId !== railDrag.id) return;
    railDrag.lx = e.clientX;
    if (railDrag.raf) return;
    railDrag.raf = requestAnimationFrame(function () {
      if (!railDrag) return;
      railDrag.raf = 0;
      setRail(railDrag.w + (railDrag.lx - railDrag.x), false);
    });
  });
  grip.addEventListener('pointerup', endRailDrag);
  grip.addEventListener('pointercancel', endRailDrag);
  grip.addEventListener('lostpointercapture', endRailDrag);
  grip.addEventListener('dblclick', function (e) { e.preventDefault(); resetRail(); });
  grip.addEventListener('keydown', function (e) {
    var step = e.shiftKey ? 64 : 16, w = railWidth(), v = null;
    if (e.key === 'ArrowLeft') v = w - step;
    else if (e.key === 'ArrowRight') v = w + step;
    else if (e.key === 'Home') v = RAIL_MIN;
    else if (e.key === 'End') v = railMax();
    else return;
    e.preventDefault();
    e.stopPropagation();

  });

  /* ---------- helpers ---------- */
  function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
  var macroSlug = function (n) { return slug(n); };
  function count(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  function opts(list, cur) {
    return list.map(function (o) {
      return '<option value="' + o[0] + '"' + (cur === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
    }).join('');
  }
  function cpBtn(text, label, cls) {
    return '<button class="btn ' + (cls || '') + '" data-copy="' + put(text) + '"><i class="ti ti-copy" aria-hidden="true"></i>' + esc(label || 'Copy') + '</button>';
  }
  function dlBtn(name, text, label, cls) {
    return '<button class="btn ' + (cls || '') + '" data-dl="' + put(text) + '" data-name="' + esc(name) + '"><i class="ti ti-download" aria-hidden="true"></i>' + esc(label || ('Download ' + name)) + '</button>';
  }
  function mark(text, q) {
    var safe = esc(text);

    var toks = q.split(/\s+/).filter(Boolean).map(function (t) { return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); });

  /* ---------- toast / io ---------- */
  var toastTimer;
  function toast(msg) {
    var t = $('toast');
    t.querySelector('span').textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('on'); }, 1600);
  }
  function legacyCopy(text) {
    var a = document.createElement('textarea');
    a.value = text;
    a.setAttribute('readonly', '');
    a.style.position = 'fixed';
    a.style.opacity = '0';
    document.body.appendChild(a);
    a.select();

    return ok;
  }
  function flashBtn(btn) {
    if (!btn) return;
    var old = btn.innerHTML;

  /* Minimal ZIP writer (stored, no compression) so a whole template can be
     downloaded as one archive without adding a dependency. */
  var CRC_TABLE = null;
  function crc32(bytes) {
    if (!CRC_TABLE) {
      CRC_TABLE = new Uint32Array(256);
      for (var n = 0; n < 256; n++) {
        var c = n;
        for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        CRC_TABLE[n] = c >>> 0;
      }
    }
    var crc = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }
  function zipBlob(files) {
    var enc = new TextEncoder();
    var parts = [], central = [], offset = 0;
    var modTime = 0, modDate = ((2026 - 1980) << 9) | (11 << 5) | 10;
    files.forEach(function (f) {
      var name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
      var lh = new Uint8Array(30 + name.length), d1 = new DataView(lh.buffer);
      d1.setUint32(0, 0x04034b50, true);
      d1.setUint16(4, 20, true);
      d1.setUint16(6, 0x0800, true);
      d1.setUint16(8, 0, true);
      d1.setUint16(10, modTime, true);
      d1.setUint16(12, modDate, true);
      d1.setUint32(14, crc, true);
      d1.setUint32(18, data.length, true);
      d1.setUint32(22, data.length, true);
      d1.setUint16(26, name.length, true);
      d1.setUint16(28, 0, true);
      lh.set(name, 30);
      parts.push(lh, data);

      var ch = new Uint8Array(46 + name.length), d2 = new DataView(ch.buffer);
      d2.setUint32(0, 0x02014b50, true);
      d2.setUint16(4, 20, true);
      d2.setUint16(6, 20, true);
      d2.setUint16(8, 0x0800, true);
      d2.setUint16(10, 0, true);
      d2.setUint16(12, modTime, true);
      d2.setUint16(14, modDate, true);
      d2.setUint32(16, crc, true);
      d2.setUint32(20, data.length, true);
      d2.setUint32(24, data.length, true);
      d2.setUint16(28, name.length, true);
      d2.setUint16(30, 0, true);
      d2.setUint16(32, 0, true);
      d2.setUint16(34, 0, true);
      d2.setUint16(36, 0, true);
      d2.setUint32(38, 0, true);
      d2.setUint32(42, offset, true);
      ch.set(name, 46);
      central.push(ch);
      offset += lh.length + data.length;
    });
    var cdSize = central.reduce(function (n, c) { return n + c.length; }, 0);
    var eocd = new Uint8Array(22), d3 = new DataView(eocd.buffer);
    d3.setUint32(0, 0x06054b50, true);
    d3.setUint16(4, 0, true);
    d3.setUint16(6, 0, true);
    d3.setUint16(8, files.length, true);
    d3.setUint16(10, files.length, true);
    d3.setUint32(12, cdSize, true);
    d3.setUint32(16, offset, true);
    d3.setUint16(20, 0, true);
    return new Blob(parts.concat(central, [eocd]), { type: 'application/zip' });
  }
  function downloadTemplateZip() {
    var t = TPL.filter(function (x) { return x.id === state.tpl; })[0];
    if (!t) return;
    var files = t.files.map(function (f) { return { name: f.n, data: f.c }; });

  /* ---------- derivation ---------- */
  function pass(x) {
    return (state.mode === 'any' || x[2] === state.mode || x[2] === 'all') &&
           (state.level === 'all' || x[1] === state.level);
  }
  function groupKeys() {
    var seen = [], out = [];
    SORTED.forEach(function (x) {
      var k = x[0].split('-')[0];
      if (seen.indexOf(k) < 0) { seen.push(k); out.push(k); }
    });
    return out;
  }
  function groupCounts() {
    var map = {};
    RULES.forEach(function (x) {
      var k = x[0].split('-')[0];
      map[k] = map[k] || { total: 0, on: 0 };
      map[k].total++;
      if (pass(x)) map[k].on++;
    });
    return map;
  }
  function firstGroup() {
    var keys = groupKeys();
    for (var i = 0; i < keys.length; i++) {
      if (RULES.some(function (x) { return x[0].split('-')[0] === keys[i] && pass(x); })) return keys[i];
    }

    return state.mode !== 'any' || state.level !== 'all';
  }
  function tplPass(x) {
    return (state.tt === 'all' || x.t === state.tt) &&
           (state.te === 'all' || x.e === state.te) &&
           (state.tl === 'all' || x.l === state.tl);

  function tplList() { return TPL.filter(tplPass); }
  /* Minimal switch: swaps the custom Book/Report entry in place (same id), nothing else changes. */
  function applyMin() {

    if (i >= 0) TPL[i] = state.min ? CUSTOM_BOOK_MIN : CUSTOM_BOOK;
  }
  function minOff() { return state.tt !== 'all' && state.tt !== 'book'; }
  function minSwitchHtml() {
    var off = minOff();
    return '<div class="minsw' + (off ? ' off' : '') + '" id="minsw"><span class="seg-label" aria-hidden="true">Minimal</span>' +
      '<button class="sw" role="switch" aria-checked="' + state.min + '" data-act="toggle-min"' + (off ? ' disabled' : '') +
      ' title="' + (off ? 'Applies to Book/Report only' : 'Strip decoration packages from Book/Report') + '">' +
      '<span class="trk" aria-hidden="true"></span><span>' + (state.min ? 'On' : 'Off') + '</span></button></div>';
  }
  function updateMinSwitch() {
    var box = $('minsw');
    if (box) box.outerHTML = minSwitchHtml();
  }
  function toggleMin() {
    if (minOff()) return;
    state.min = !state.min;
    applyMin();
    persist();
    renderTplBody();
    updateMinSwitch();
  }

  /* ---------- routing ---------- */
  function parseHash() {
    var raw = (location.hash || '').replace(/^#\/?/, '');
    var p = raw.split('/').filter(Boolean);
    if (!p.length) {
      var r = state.resume;
      if (r && RES.some(function (x) { return x.k === r.view; })) {
        return { view: r.view, group: r.group || null, macro: r.macro || null, tpl: r.tpl || null, sub: r.sub || 'pitfalls' };
      }
      return { view: 'rules', group: null };
    }
    if (/^[A-Z]{3,4}-\d{2}$/i.test(p[0])) {
      var id = p[0].toUpperCase();
      return { view: 'rules', group: id.split('-')[0], rule: id };
    }
    var view = RES.some(function (x) { return x.k === p[0]; }) ? p[0] : 'rules';
    if (view === 'rules') {
      var g = (p[1] || '').toUpperCase(), rule = null;
      if (g && /^[A-Z]{3,4}-\d{2}$/.test(g)) { rule = g; g = g.split('-')[0]; }
      return { view: 'rules', group: GR[g] ? g : null, rule: rule };
    }
    if (view === 'macros') return { view: 'macros', macro: p[1] || null };
    if (view === 'templates') return { view: 'templates', tpl: p[1] || null, file: p[2] ? decodeURIComponent(p[2]) : null };
    if (view === 'review') return { view: 'review', sub: p[1] === 'checklist' ? 'checklist' : 'pitfalls' };
    return { view: 'ai' };
  }
  function routeHash(r) {
    if (r.view === 'rules') {
      if (r.rule) return '/rules/' + r.rule;
      return '/rules' + (r.group && GR[r.group] ? '/' + r.group : '');
    }
    if (r.view === 'macros') return '/macros' + (r.macro ? '/' + r.macro : '');
    if (r.view === 'templates') {
      if (!r.tpl) return '/templates';
      return '/templates/' + r.tpl + (r.file ? '/' + encodeURIComponent(r.file) : '');
    }
    if (r.view === 'review') return '/review/' + (r.sub || 'pitfalls');
    return '/ai';
  }
  function resHref(k) {
    if (k === 'rules') return '#' + routeHash({ view: 'rules', group: state.group });
    if (k === 'macros') return '#' + routeHash({ view: 'macros', macro: state.macro });
    if (k === 'templates') return '#' + routeHash({ view: 'templates', tpl: state.tpl });
    if (k === 'review') return '#' + routeHash({ view: 'review', sub: state.sub });
    return '#/ai';
  }
  function applyRoute(r) {
    state.view = r.view;
    if (r.view === 'rules') {
      state.group = r.group || state.group;
      state.rule = r.rule || null;
    }
    if (r.view === 'macros') state.macro = r.macro || state.macro;
    if (r.view === 'templates') {
      if (r.tpl && r.tpl !== state.tpl) { state.tsub = 'source'; }
      state.tpl = r.tpl || state.tpl;
      state.file = r.file || null;
    }
    if (r.view === 'review') state.sub = r.sub || state.sub;
    state.route = r;
    if (r.rule) pending = { id: r.rule, flash: true };
    else if (r.macro) pending = { id: 'm-' + r.macro };
  }
  function placeKey() { return state.view + '|' + state.group + '|' + state.tpl + '|' + state.sub; }
  function go(r, replace) {
    var h = '#' + routeHash(r);
    try {
      if (replace) history.replaceState(null, '', h); else history.pushState(null, '', h);
    } catch (_) { location.hash = h; return; }
    var before = placeKey();
    applyRoute(parseHash());
    if (before !== placeKey()) scrollTo(0, 0);
    render();
  }
  function onHash() {
    if (location.hash === '#pane' || location.hash === '#') { $('pane').focus(); return; }
    var before = placeKey();
    applyRoute(parseHash());
    if (before !== placeKey()) scrollTo(0, 0);
    render();
    closeDrawer();
  }
  addEventListener('popstate', onHash);
  addEventListener('hashchange', onHash);

  /* ---------- theme ---------- */
  function syncThemeBtn() {
    var b = $('theme'), dark = state.theme === 'dark';
    b.innerHTML = '<i class="ti ' + (dark ? 'ti-sun' : 'ti-moon') + '" aria-hidden="true"></i>';
    b.setAttribute('aria-label', dark ? 'Use light theme' : 'Use dark theme');
  }
  function applyTheme(t) {
    state.theme = t;
    document.documentElement.classList.toggle('dark', t === 'dark');
    syncThemeBtn();
    persist();
  }
  function toggleTheme(origin) {
    var next = state.theme === 'dark' ? 'light' : 'dark';
    if (!document.startViewTransition || reduceMotion()) { applyTheme(next); return; }
    var x = origin && origin.x ? origin.x : innerWidth - 40;
    var y = origin && origin.y ? origin.y : 28;
    var r = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    var vt = document.startViewTransition(function () { applyTheme(next); });
    vt.ready.then(function () {
      document.documentElement.animate(
        { clipPath: ['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + r + 'px at ' + x + 'px ' + y + 'px)'] },
        { duration: 460, easing: 'cubic-bezier(.16,1,.3,1)', pseudoElement: '::view-transition-new(root)' }
      );
    }).catch(function () {});
  }

  /* ---------- KaTeX ---------- */
  function renderMath(scope) {
    if (typeof katex === 'undefined' || !scope) return false;
    var nodes = scope.querySelectorAll('[data-tex]:not([data-tex-done])');
    Array.prototype.forEach.call(nodes, function (n) {
      try {
        katex.render(n.getAttribute('data-tex'), n, { throwOnError: false, macros: Object.assign({}, KM) });
      } catch (_) { n.textContent = n.getAttribute('data-tex'); }
      n.setAttribute('data-tex-done', '1');
    });
    return true;
  }

  /* ---------- rail ---------- */
  function renderRail() {
    var counts = { rules: RULES.length, macros: MACROS.length, templates: TPL.length, review: CK.length };
    $('resources').innerHTML = RES.map(function (r) {
      return '<a class="res" href="' + resHref(r.k) + '" data-res="' + r.k + '"' +
        (state.view === r.k ? ' aria-current="page"' : '') + '>' +
        '<i class="ti ' + r.icon + '" aria-hidden="true"></i><span>' + r.label + '</span>' +
        (counts[r.k] != null ? '<span class="n">' + counts[r.k] + '</span>' : '') + '</a>';
    }).join('');

    $('rail-filters').innerHTML = state.view !== 'rules' ? '' :
      '<hr class="rail-sep">' +
      '<div class="rail-h"><b>Filter</b>' + (filtersActive() ? '<button class="btn" data-act="clear" style="height:22px;font-size:11px;padding:0 6px">Clear</button>' : '') + '</div>' +
      '<div class="rail-filters">' +
        '<label class="fl">Mode<select data-k="mode" aria-label="Document type filter">' + opts(MODES, state.mode) + '</select></label>' +
        '<label class="fl">Level<select data-k="level" aria-label="Rule level filter">' + opts(LEVELS, state.level) + '</select></label>' +
      '</div>';

    $('rail-index').innerHTML = railIndex();
  }

  function railIndex() {
    if (state.view === 'rules') {
      var gc = groupCounts();
      var keys = groupKeys();
      var on = RULES.filter(pass).length;
      return '<hr class="rail-sep">' +
        '<div class="rail-h"><b>Rules</b><span>' + on + ' / ' + RULES.length + '</span></div>' +
        '<div class="idx" role="list">' + keys.map(function (k) {
          var d = gc[k] || { total: 0, on: 0 };
          var cur = state.group === k;
          return '<a class="grp" role="listitem" href="#' + routeHash({ view: 'rules', group: k }) + '" data-group="' + k + '"' +
            (cur ? ' aria-current="true"' : '') + (d.on === 0 ? ' style="opacity:.45"' : '') + '>' +
            '<span>' + esc(GR[k]) + '</span><span class="n">' + d.on + '</span></a>';
        }).join('') + '</div>';
    }
    if (state.view === 'macros') {
      return '<hr class="rail-sep"><div class="rail-h"><b>Macro groups</b><span>' + MACROS.length + '</span></div>' +
        '<div class="idx" role="list">' + MACROS.map(function (m) {
          var s = macroSlug(m[0]);
          return '<a class="grp" role="listitem" href="#' + routeHash({ view: 'macros', macro: s }) + '" data-macro="' + s + '"' +
            (state.macro === s ? ' aria-current="true"' : '') + '><span>' + esc(m[0]) + '</span></a>';
        }).join('') + '</div>';
    }
    if (state.view === 'templates') {
      return '<hr class="rail-sep"><div class="rail-h"><b>Templates</b><span>' + TPL.length + '</span></div>' +
        '<div class="idx" role="list">' + TPL.map(function (x) {
          return '<a class="grp sm" role="listitem" href="#' + routeHash({ view: 'templates', tpl: x.id }) + '" data-tpl="' + x.id + '"' +
            (state.tpl === x.id ? ' aria-current="true"' : '') + '>' +
            '<span>' + esc(x.title) + '</span><span class="n">' + x.files.length + '</span></a>';
        }).join('') + '</div>';
    }
    if (state.view === 'review') {
      return '<hr class="rail-sep"><div class="rail-h"><b>Review</b><span>' + (DD.length + CK.length) + '</span></div>' +
        '<div class="idx" role="list">' +
        '<a class="grp" role="listitem" href="#/review/pitfalls" data-sub="pitfalls"' + (state.sub === 'pitfalls' ? ' aria-current="true"' : '') + '><span>Pitfalls</span><span class="n">' + DD.length + '</span></a>' +
        '<a class="grp" role="listitem" href="#/review/checklist" data-sub="checklist"' + (state.sub === 'checklist' ? ' aria-current="true"' : '') + '><span>Checklist</span><span class="n">' + CK.length + '</span></a>' +
        '</div>';
    }
    return '<hr class="rail-sep"><div class="rail-h"><b>Export</b></div>' +
      '<div class="idx"><span class="grp" style="cursor:default;color:var(--faint)"><span>' + RULES.length + ' rules, ' + DD.length + ' pitfalls, ' + CK.length + ' checks</span></span></div>';
  }

  /* ---------- rules view ---------- */
  function band(x, i) {
    var id = x[0], lvl = x[1], mode = x[2], title = x[3], expl = x[4], dont = x[5], doTex = x[6], prev = x[7];
    return '<article class="band" id="' + id + '" data-rule="' + id + '" style="--i:' + i + '">' +
      '<div class="band-h">' +
        '<code class="rid">' + id + '</code>' +
        '<i class="dot-sep" aria-hidden="true"></i>' +
        '<span class="lvl" data-l="' + lvl + '"><i class="dot" aria-hidden="true"></i>' + LV[lvl][0] + '</span>' +
        '<i class="dot-sep" aria-hidden="true"></i>' +
        '<span class="mode-tag">' + MD[mode] + '</span>' +
      '</div>' +
      '<h2 class="band-t">' + esc(title) + '</h2>' +
      '<p class="band-x">' + esc(expl) + '</p>' +
      '<div class="cmp">' +
        '<div class="cmp-col dont"><div class="cmp-h"><i class="dot" aria-hidden="true"></i>Don\'t</div><pre>' + esc(dont) + '</pre></div>' +
        '<div class="cmp-col do"><div class="cmp-h"><i class="dot" aria-hidden="true"></i>Do</div><pre>' + esc(doTex) + '</pre></div>' +
        (prev ? '<div class="math" data-tex="' + esc(prev) + '"></div>' : '') +
      '</div>' +
      '<div class="band-a">' +
        '<button class="btn good" data-copy="' + put(doTex) + '"><i class="ti ti-copy" aria-hidden="true"></i>Copy Do</button>' +
        '<button class="btn" data-copylink="' + id + '"><i class="ti ti-link" aria-hidden="true"></i>Copy link</button>' +
      '</div>' +
    '</article>';
  }

  function viewRules() {
    var keys = groupKeys();
    var g = (state.group && GR[state.group]) ? state.group : firstGroup();
    state.group = g;
    var animate = lastGroup !== g;
    lastGroup = g;
    var all = SORTED.filter(function (x) { return x[0].split('-')[0] === g; });
    var items = all.filter(pass);
    var hiddenRule = null;
    if (state.rule) {
      var found = items.some(function (x) { return x[0] === state.rule; });
      if (!found) hiddenRule = all.some(function (x) { return x[0] === state.rule; }) ? state.rule : null;
    }
    var idx = keys.indexOf(g);
    var prev = keys[idx - 1], next = keys[idx + 1];

    var h = '<div class="page-h">' +
      '<h1>' + esc(GR[g]) + '</h1>' +
      '<span class="count">' + count(items.length, 'rule', 'rules') + '</span>' +
      '<details class="menu"><summary><i class="ti ti-dots" aria-hidden="true"></i>Export</summary>' +
        '<div class="menu-panel">' +
          '<button data-act="copy-guide"><i class="ti ti-copy" aria-hidden="true"></i>Copy all rules as Markdown</button>' +
          '<button data-act="dl-guide"><i class="ti ti-file-download" aria-hidden="true"></i>Download latex-rules.md</button>' +
          '<button data-act="print"><i class="ti ti-printer" aria-hidden="true"></i>Print rules</button>' +
        '</div>' +
      '</details>' +
    '</div>';

    if (hiddenRule) {
      h += '<div class="rule-note"><i class="ti ti-filter-off" aria-hidden="true"></i><div><b>' + hiddenRule +
        '</b> is hidden by the current filters.<br><button class="btn" data-act="clear" style="margin-top:8px"><i class="ti ti-filter" aria-hidden="true"></i>Clear filters</button></div></div>';
    }
    if (!items.length) {
      h += '<div class="empty">No rules in this group match Mode ' + labelOf(MODES, state.mode) + ' and Level ' +
        labelOf(LEVELS, state.level) + '.<br><button class="btn" data-act="clear"><i class="ti ti-filter" aria-hidden="true"></i>Clear filters</button></div>';
    } else {
      h += '<div class="cmp-head"><span><i class="dot"></i>Don\'t</span><span><i class="dot do"></i>Do</span></div>';
      h += '<div class="bands' + (animate ? ' enter' : '') + '">' + items.map(band).join('') + '</div>';
    }
    h += '<nav class="pager" aria-label="Rule groups">' +
      (prev ? '<a class="prev" href="#' + routeHash({ view: 'rules', group: prev }) + '"><span class="k">Previous group</span><span class="v">' + esc(GR[prev]) + '</span></a>' : '<span></span>') +
      (next ? '<a class="next" href="#' + routeHash({ view: 'rules', group: next }) + '"><span class="k">Next group</span><span class="v">' + esc(GR[next]) + '</span></a>' : '<span></span>') +
      '</nav>';
    return h;
  }
  function labelOf(list, v) {
    for (var i = 0; i < list.length; i++) if (list[i][0] === v) return list[i][1];
    return v;
  }

  /* ---------- macros view ---------- */
  function viewMacros() {
    var first = macroSlug(MACROS[0][0]);
    if (!state.macro) state.macro = first;
    var anim = !macroAnimated;
    macroAnimated = true;
    var h = '<div class="page-h"><h1>Macro Pack</h1><span class="count">' + count(MACROS.length, 'group', 'groups') + '</span></div>' +
      '<div class="macro-tools">' +
        cpBtn(STY, 'Copy mymath.sty', 'solid') +
        dlBtn('mymath.sty', STY, 'Download mymath.sty') +
        '<span class="meta">' + STY.split('\n').length + ' lines · amsmath, amssymb, mathtools</span>' +
      '</div>' +
      '<div class="' + (anim ? 'enter' : '') + '">' + MACROS.map(function (m, i) {
        var s = macroSlug(m[0]);
        return '<section class="macro" id="m-' + s + '" style="--i:' + i + '">' +
          '<div class="macro-h"><h2>' + esc(m[0]) + '</h2>' + cpBtn(m[1], 'Copy group') + '</div>' +
          '<pre>' + esc(m[1]) + '</pre>' +
          m[2].map(function (p) { return '<div class="math" data-tex="' + esc(p) + '"></div>'; }).join('') +
        '</section>';
      }).join('') + '</div>';
    return h;
  }

  /* ---------- templates view ---------- */
  function currentTpl() {
    var list = tplList();
    return list.filter(function (x) { return x.id === state.tpl; })[0] || list[0] || null;
  }

  /* One segmented control, macOS/iOS style: a track, a sliding knob and radio semantics. */
  function seg(key, label, options, cls) {
    var cur = state[key];
    return '<div class="seg-field' + (cls ? ' ' + cls : '') + '">' +
      '<span class="seg-label" aria-hidden="true">' + label + '</span>' +
      '<div class="seg" role="radiogroup" aria-label="' + label + '" data-segkey="' + key + '">' +
        '<i class="seg-knob" aria-hidden="true"></i>' +
        options.map(function (o) {
          var on = cur === o[0];
          return '<button class="seg-btn" role="radio" aria-checked="' + on + '" tabindex="' + (on ? '0' : '-1') +
            '" data-seg="' + key + '" data-v="' + o[0] + '" title="' + esc(o[1]) + '">' + esc(o[1]) + '</button>';
        }).join('') +
      '</div></div>';
  }

  function tplBodyHtml() {
    var cur = currentTpl();
    if (!cur) {
      return '<div class="empty">No template matches these filters.<br><button class="btn" data-act="clear-tpl"><i class="ti ti-filter" aria-hidden="true"></i>Clear filters</button></div>';
    }
    state.tpl = cur.id;
    var file = cur.files.filter(function (f) { return f.n === state.file; })[0] || cur.files[0];
    state.file = file.n;
    var sub = state.tsub === 'setup' && cur.guide ? 'setup' : 'source';
    var engine = cur.e === 'xe' ? 'XeLaTeX' : 'pdfLaTeX';
    var h = '';

    h += '<div class="tpl-wrap">';

    /* file list */
    h += '<div class="tpl-side"><div class="tpl-side-h"><span>Files</span><span>' + cur.files.length + '</span></div>' +
      '<div class="tpl-files" role="list">' + cur.files.map(function (f) {
        var on = f.n === file.n;
        return '<a class="file" role="listitem" href="#' + routeHash({ view: 'templates', tpl: cur.id, file: f.n }) + '" data-file="' + esc(f.n) + '"' +
        (on ? ' aria-current="true"' : '') + '><i class="ti ' + (on ? 'ti-file-text' : 'ti-file') + '" aria-hidden="true"></i>' +
          '<span>' + esc(f.n) + '</span><span class="n">' + f.c.split('\n').length + '</span></a>';
      }).join('') + '</div>' +
      (cur.desc ? '<div class="tpl-note">' + esc(cur.desc) + '</div>' : '');
    if (cur.t === 'book') {
      h += '<div class="tpl-extra"><span class="meta">A refs.bib file is required next to the main file. Cite with \\cite{key}, then run bibtex.</span>' +
        '<div class="acts">' + cpBtn(BIB, 'Copy sample refs.bib') + dlBtn('refs.bib', BIB, 'refs.bib') + '</div></div>';
    } else if (!cur.nobib) {
      h += '<div class="tpl-extra"><span class="meta">The bibliography is inside main.tex: remove the % from the thebibliography block and cite with \\cite{key}. No refs.bib, natbib or bibtex needed. Compile twice.</span></div>';
    } else {
      h += '<div class="tpl-extra"><span class="meta">No bibliography needed. Compile ' + esc(cur.files[0].n) + ' with pdfLaTeX.</span></div>';
    }
    h += '</div>';

    /* source */
    h += '<div class="tpl-main"><div class="tpl-bar"><i class="ti ti-file-code" aria-hidden="true" style="color:var(--faint)"></i>' +
      '<span class="fn">' + esc(file.n) + '</span>' +
      '<div class="acts">' + cpBtn(file.c, 'Copy file') + dlBtn(file.n, file.c, 'Download') + '</div></div>';

    h += '<div class="tabs" role="tablist">' +
      '<button class="tab" role="tab" data-tsub="source" aria-selected="' + (sub === 'source') + '"><i class="ti ti-code" aria-hidden="true"></i>Source</button>' +
      (cur.guide ? '<button class="tab" role="tab" data-tsub="setup" aria-selected="' + (sub === 'setup') + '"><i class="ti ti-list-numbers" aria-hidden="true"></i>Setup</button>' : '') +
      '</div>';

    if (sub === 'setup' && cur.guide) {
      h += '<div class="setup"><h3>How to use ' + esc(cur.title.split(' · ')[0]) + '</h3><ol>' +
        cur.guide.map(function (g) { return '<li>' + g + '</li>'; }).join('') + '</ol>';
      if (cur.example) {
        h += '<h3>Example questions</h3><div class="acts" style="margin-bottom:8px">' + cpBtn(cur.example, 'Copy example') + '</div>' +
          '<pre class="src" style="border:1px solid var(--line);border-radius:8px;max-height:240px">' + esc(cur.example) + '</pre>';
      }
      h += '</div>';
    } else {
      h += '<pre class="src">' + esc(file.c) + '</pre>';
    }
    h += '</div></div>';

    h += '<div class="tpl-meta" style="padding-top:14px"><div class="tags">' +
      '<span class="tag"><i class="ti ti-file-description" aria-hidden="true"></i>' + esc(cur.title.split(' · ')[0]) + '</span>' +
      '<span class="tag"><i class="ti ti-settings" aria-hidden="true"></i>' + engine + '</span>' +
      '<span class="tag"><i class="ti ti-language" aria-hidden="true"></i>' + (cur.l === 'vi' ? 'Vietnamese' : 'English') + '</span>' +
      '<span class="tag"><i class="ti ti-files" aria-hidden="true"></i>' + count(cur.files.length, 'file', 'files') + '</span>' +
      '</div></div>';
    return h;
  }

  function viewTemplates() {
    var cur = currentTpl();
    var zipCount = cur ? cur.files.length + (cur.t === 'book' ? 1 : 0) : 0;
    return '<div class="page-h"><h1>Templates</h1><span class="count" id="tpl-count">' + count(tplList().length, 'template', 'templates') + '</span></div>' +
      '<div class="filters-bar">' +
        seg('tt', 'Type', TTPL, 'grow') +
        seg('te', 'Engine', TEN) +
        seg('tl', 'Language', TLANG) +
        minSwitchHtml() +
        '<button class="btn zip" data-act="dl-zip" title="All files of this template in one archive">' +
          '<i class="ti ti-folder-down" aria-hidden="true"></i>Download .zip' + (cur ? ' (' + zipCount + ' files)' : '') +
        '</button>' +
      '</div>' +
      '<div id="tpl-body">' + tplBodyHtml() + '</div>';
  }

  /* Filters re-render only the body, so the segmented knob keeps its animation. */
  function renderTplBody() {
    var box = $('tpl-body');
    if (!box) return;
    updateMinSwitch();
    box.innerHTML = tplBodyHtml();
    var c = $('tpl-count');
    if (c) c.textContent = count(tplList().length, 'template', 'templates');
    var zip = document.querySelector('.btn.zip');
    var cur = currentTpl();
    if (zip && cur) {
      zip.innerHTML = '<i class="ti ti-folder-down" aria-hidden="true"></i>Download .zip (' +
        (cur.files.length + (cur.t === 'book' ? 1 : 0)) + ' files)';
    }
    renderRail();
    persist();
  }

  /* knob geometry: measured from the live boxes so it stays aligned at any zoom or scroll */
  function positionKnob(segEl) {
    var on = segEl.querySelector('.seg-btn[aria-checked="true"]');
    if (!on) return;
    var sr = segEl.getBoundingClientRect(), br = on.getBoundingClientRect();
    var border = parseFloat(getComputedStyle(segEl).borderLeftWidth) || 0;
    segEl.style.setProperty('--x', (br.left - sr.left - border) + 'px');
    segEl.style.setProperty('--w', br.width + 'px');
  }
  function revealSeg(segEl, btn) {
    var pad = 10;
    var left = btn.offsetLeft - segEl.scrollLeft;
    if (left < pad || left + btn.offsetWidth > segEl.clientWidth - pad) {
      segEl.scrollLeft = Math.max(0, btn.offsetLeft - segEl.clientWidth / 2 + btn.offsetWidth / 2);
    }
  }
  function initSegs(scope) {
    Array.prototype.forEach.call((scope || document).querySelectorAll('.seg'), function (s) {
      var knob = s.querySelector('.seg-knob');
      if (knob) knob.style.transition = 'none';
      positionKnob(s);
      var on = s.querySelector('.seg-btn[aria-checked="true"]');
      if (on) revealSeg(s, on);
      if (knob) requestAnimationFrame(function () { knob.style.transition = ''; });
    });
  }
  function pickSegment(btn) {
    var key = btn.getAttribute('data-seg'), val = btn.getAttribute('data-v');
    if (!key || state[key] === val) return;
    if (key === 'ai') {
      state.ai = val;
      var segA = btn.closest('.seg');
      Array.prototype.forEach.call(segA.querySelectorAll('.seg-btn'), function (b) { var on = b === btn; b.setAttribute('aria-checked', String(on)); b.tabIndex = on ? 0 : -1; });
      positionKnob(segA); revealSeg(segA, btn);
      var bd = document.getElementById('ai-body'); if (bd) bd.innerHTML = aiBodyHtml();
      var ct = document.getElementById('ai-count'); if (ct) ct.textContent = count(aiText(val).split('\n').length, 'line', 'lines');
      persist();
      return;
    }
    state[key] = val;
    state.tpl = null;
    state.file = null;
    var segEl = btn.closest('.seg');
    Array.prototype.forEach.call(segEl.querySelectorAll('.seg-btn'), function (b) {
      var on = b === btn;
      b.setAttribute('aria-checked', String(on));
      b.tabIndex = on ? 0 : -1;
    });
    positionKnob(segEl);
    revealSeg(segEl, btn);
    renderTplBody();
  }

  /* ---------- review view ---------- */
  function viewReview() {
    var sub = state.sub === 'checklist' ? 'checklist' : 'pitfalls';
    var h = '<div class="page-h"><h1>Review</h1><span class="count">' + DD.length + ' pitfalls · ' + CK.length + ' checks</span></div>' +
      '<div class="subtabs" role="tablist">' +
        '<button class="tab" role="tab" data-sub="pitfalls" aria-selected="' + (sub === 'pitfalls') + '">Pitfalls</button>' +
        '<button class="tab" role="tab" data-sub="checklist" aria-selected="' + (sub === 'checklist') + '">Checklist</button>' +
      '</div>';

    if (sub === 'pitfalls') {
      h += '<div class="tbl-scroll"><table class="tbl"><thead><tr><th scope="col">Don\'t write</th><th scope="col">Write instead</th></tr></thead><tbody>' +
        DD.map(function (d) {
          return '<tr><td class="dn"><code>' + esc(d[0]) + '</code></td><td><code>' + esc(d[1]) + '</code></td></tr>';
        }).join('') + '</tbody></table></div>';
    } else {
      var done = state.done.size;
      h += '<div class="chk-tools"><div class="bar"><i style="transform:scaleX(' + (CK.length ? done / CK.length : 0) + ')"></i></div>' +
        '<span class="meta">' + done + ' / ' + CK.length + '</span>' +
        '<button class="btn" data-act="reset-checks"><i class="ti ti-rotate" aria-hidden="true"></i>Reset</button></div>';
      h += '<div class="chk">' + CK.map(function (c, i) {
        return '<label><input type="checkbox" data-chk="' + i + '"' + (state.done.has(i) ? ' checked' : '') + '><span>' + esc(c) + '</span></label>';
      }).join('') + '</div>';
      h += '<div class="acts" style="margin-top:16px">' + cpBtn(CK.map(function (c) { return '- [ ] ' + c; }).join('\n'), 'Copy checklist') + '</div>';
    }
    return h;
  }

  /* ---------- ai view ---------- */
  var AI_OPTS = [['common', 'Common'], ['article', 'Article'], ['book', 'Book/Report'], ['full', 'Full']];
  var AI_FILE = { common: 'latex-rules-common.md', article: 'latex-rules-article.md', book: 'latex-rules-book.md', full: 'latex-rules.md' };
  var AI_HINT = {
    common: 'The short set that applies to every template: 9 lines to paste into a system prompt.',
    article: 'Common plus the Article rules: full environment names, sec/subsec labels, bibliography inside the file.',
    book: 'Common plus the Book/Report rules: short environment names, chapter labels, refs.bib.',
    full: 'Every rule with its Don\'t / Do examples, the conventions, common mistakes and the checklist.'
  };
  function aiText(k) { return k === 'article' ? guideArticle() : k === 'book' ? guideBook() : k === 'full' ? guide() : guideCommon(); }
  function aiBodyHtml() {
    var k = state.ai || 'common', g = aiText(k);
    return '<p class="hint">' + AI_HINT[k] + '</p>' +
      '<div class="acts" style="margin:14px 0">' + cpBtn(g, 'Copy', 'solid') + dlBtn(AI_FILE[k], g, 'Download ' + AI_FILE[k]) + '</div>' +
      '<pre class="src" style="border:1px solid var(--line);border-radius:10px;max-height:min(64vh,620px)">' + esc(g) + '</pre>';
  }
  function viewAI() {
    var k = state.ai || 'common';
    return '<div class="page-h"><h1>AI prompt</h1><span class="count" id="ai-count">' + count(aiText(k).split('\n').length, 'line', 'lines') + '</span></div>' +
      '<div class="filters-bar">' + seg('ai', 'Rule set', AI_OPTS, 'grow') + '</div>' +
      '<div id="ai-body">' + aiBodyHtml() + '</div>';
  }

  /* ---------- search ---------- */
  var INDEX = [];
  function buildIndex() {
    RULES.forEach(function (x) {
      INDEX.push({
        kind: 'Rule', id: x[0], title: x[3], meta: GR[x[0].split('-')[0]],
        hay: (x[0] + ' ' + x[3] + ' ' + x[4] + ' ' + x[5] + ' ' + x[6] + ' ' + MD[x[2]] + ' ' + GR[x[0].split('-')[0]]).toLowerCase(),
        route: { view: 'rules', group: x[0].split('-')[0], rule: x[0] }
      });
    });
    MACROS.forEach(function (m) {
      INDEX.push({
        kind: 'Macro', id: '', title: m[0], meta: 'Macro Pack',
        hay: (m[0] + ' ' + m[1]).toLowerCase(),
        route: { view: 'macros', macro: macroSlug(m[0]) }
      });
    });
    TPL.forEach(function (x) {
      INDEX.push({
        kind: 'Template', id: x.id, title: x.title, meta: x.files.length + ' files',
        hay: (x.title + ' ' + x.desc + ' ' + x.e + ' ' + x.l).toLowerCase(),
        route: { view: 'templates', tpl: x.id }
      });
      x.files.forEach(function (f) {
        INDEX.push({
          kind: 'File', id: x.id, title: f.n, meta: x.title.split(' · ')[0],
          hay: (f.n + ' ' + f.c).toLowerCase(),
          route: { view: 'templates', tpl: x.id, file: f.n }
        });
      });
    });
    DD.forEach(function (d) {
      INDEX.push({ kind: 'Pitfall', id: '', title: d[0] + '  →  ' + d[1], meta: 'Pitfalls', hay: (d[0] + ' ' + d[1]).toLowerCase(), route: { view: 'review', sub: 'pitfalls' } });
    });
    CK.forEach(function (c) {
      INDEX.push({ kind: 'Check', id: '', title: c, meta: 'Checklist', hay: c.toLowerCase(), route: { view: 'review', sub: 'checklist' } });
    });
  }
  function search(q) {
    var toks = q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!toks.length) return [];
    var out = [];
    INDEX.forEach(function (it) {
      for (var i = 0; i < toks.length; i++) if (it.hay.indexOf(toks[i]) < 0) return;
      var s = 0, ql = q.toLowerCase(), tl = it.title.toLowerCase();
      if (it.id && it.id.toLowerCase() === ql) s += 120;
      if (it.id && it.id.toLowerCase().indexOf(ql) === 0) s += 50;
      if (tl.indexOf(ql) === 0) s += 30;
      if (tl.indexOf(ql) > -1) s += 10;
      if (it.kind === 'Rule') s += 4;
      if (it.kind === 'File') s -= 2;
      out.push({ it: it, s: s });
    });
    out.sort(function (a, b) { return b.s - a.s; });
    return out.slice(0, 60).map(function (r) { return r.it; });
  }
  function renderPanel() {
    var p = $('search-panel');
    if (!state.q) { closePanel(); return; }
    var hits = search(state.q);
    panelHits = [];
    if (!hits.length) {
      p.innerHTML = '<div class="sp-head"><span>No match for "' + esc(state.q) + '"</span><span>Esc</span></div>' +
        '<div class="sp-empty">Try a rule ID such as <b>THM-05</b>, a macro name, or <b>beamer</b>.</div>';
      p.hidden = false;
      $('q').setAttribute('aria-expanded', 'true');
      return;
    }
    var html = '<div class="sp-head"><span>' + count(hits.length, 'match', 'matches') + '</span><span id="sp-count">0</span></div>';
    var byKind = {};
    hits.forEach(function (h) { (byKind[h.kind] = byKind[h.kind] || []).push(h); });
    KIND_ORDER.forEach(function (kind) {
      var list = (byKind[kind] || []).slice(0, 5);
      if (!list.length) return;
      html += '<div class="sp-group">' + kind + 's<span class="line"></span><span>' + (byKind[kind].length) + '</span></div>';
      list.forEach(function (h) {
        var i = panelHits.length;
        panelHits.push(h);
        html += '<button class="sp-item" role="option" data-hit="' + i + '" aria-selected="' + (i === panelCur) + '">' +
          '<span class="kind">' + (h.id || '—') + '</span>' +
          '<span class="t">' + mark(h.title, state.q) + '</span>' +
          '<span class="w">' + esc(h.meta) + '</span></button>';
      });
    });
    html += '<div class="sp-foot"><span>↑↓ move</span><span>⏎ open</span><span>Esc close</span></div>';
    p.innerHTML = html;
    p.hidden = false;
    $('q').setAttribute('aria-expanded', 'true');
    var c = p.querySelector('#sp-count');
    if (c) c.textContent = panelHits.length + ' shown';
    var sel = p.querySelector('[aria-selected="true"]');
    if (sel) p.scrollTop = Math.max(0, sel.offsetTop - p.clientHeight / 2 + sel.offsetHeight / 2);
  }
  function openPanel() { panelCur = 0; renderPanel(); }
  function closePanel() {
    var p = $('search-panel');
    p.hidden = true;
    p.innerHTML = '';
    panelHits = [];
    $('q').setAttribute('aria-expanded', 'false');
  }
  function panelOpen() { return !$('search-panel').hidden; }
  function movePanel(d) {
    if (!panelHits.length) return;
    panelCur = (panelCur + d + panelHits.length) % panelHits.length;
    renderPanel();
  }
  function openHit(i) {
    var h = panelHits[i];
    if (!h) return;
    go(h.route);
    closePanel();
    $('q').value = '';
    state.q = '';
    $('q').blur();
    if (drawerOpen) closeDrawer();
  }

  /* ---------- drawer ---------- */
  function openDrawer() {
    drawerOpen = true;
    $('rail').scrollTop = 0;
    $('rail').classList.add('open');
    var s = $('scrim');
    s.hidden = false;
    requestAnimationFrame(function () { s.classList.add('on'); });
    $('menu').setAttribute('aria-expanded', 'true');
  }
  function closeDrawer() {
    if (!drawerOpen) return;
    drawerOpen = false;
    $('rail').classList.remove('open');
    var s = $('scrim');
    s.classList.remove('on');
    setTimeout(function () { if (!drawerOpen) s.hidden = true; }, 240);
    $('menu').setAttribute('aria-expanded', 'false');
  }

  /* ---------- render ---------- */
  var VIEWS = { rules: viewRules, macros: viewMacros, templates: viewTemplates, review: viewReview, ai: viewAI };

  function render() {
    store = [];
    $('scope').textContent = (RES.filter(function (r) { return r.k === state.view; })[0] || RES[0]).label;
    renderRail();
    centerRail();
    var pane = $('pane');
    pane.innerHTML = VIEWS[state.view]();
    initSegs(pane);
    renderMath(pane);
    syncThemeBtn();
    updateProgress();
    tickChecklist();
    persist();
    if (pending) {
      var node = document.getElementById(pending.id);
      if (node) {
        node.scrollIntoView({ block: 'start' });
        if (pending.flash) {
          node.classList.add('flash');
          setTimeout(function () { node.classList.remove('flash'); }, 1200);
        }
      }
      pending = null;
    }
  }
  function tickChecklist() {
    if (state.view !== 'review' || state.sub !== 'checklist') return;
    var bar = document.querySelector('.chk-tools .bar i');
    if (bar) bar.style.transform = 'scaleX(' + (CK.length ? state.done.size / CK.length : 0) + ')';
  }

  /* ---------- progress + spotlight ---------- */
  var ticking = false;
  function updateProgress() {
    var doc = document.scrollingElement || document.documentElement;
    var max = doc.scrollHeight - innerHeight;
    var p = max > 0 ? Math.min(1, Math.max(0, doc.scrollTop / max)) : 0;
    $('progress').style.setProperty('--p', state.view === 'rules' ? p.toFixed(4) : '0');
  }
  function centerRail() {
    if (innerWidth < 900) return;
    var rail = $('rail');
    var row = rail.querySelector('.grp[aria-current="true"]') || rail.querySelector('.res[aria-current="page"]');
    if (!row) return;
    var top = row.offsetTop - rail.scrollTop;
    if (top < 10 || top > rail.clientHeight - 44) {
      rail.scrollTop = Math.max(0, row.offsetTop - rail.clientHeight / 2);
    }
  }
  addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () { ticking = false; updateProgress(); });
  }, { passive: true });

  document.addEventListener('pointermove', function (e) {
    var col = e.target.closest ? e.target.closest('.cmp-col.do') : null;
    if (!col) return;
    var r = col.getBoundingClientRect();
    col.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    col.style.setProperty('--my', (e.clientY - r.top) + 'px');
  }, { passive: true });

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-copy],[data-dl],[data-copylink],[data-act],[data-hit],[data-group],[data-macro],[data-tpl],[data-file],[data-sub],[data-tsub],[data-seg],[data-res],[data-step]');
    if (!b) {
      if (!e.target.closest || !e.target.closest('.menu')) {
        Array.prototype.forEach.call(document.querySelectorAll('.menu[open]'), function (m) { m.removeAttribute('open'); });
      }
      return;
    }
    var d = b.dataset;

    if (d.copy != null) { copy(store[+d.copy], b); return; }
    if (d.dl != null) { download(d.name, store[+d.dl]); return; }
    if (d.copylink) {
      copy(location.href.split('#')[0] + '#/rules/' + d.copylink, b);
      return;
    }
    if (d.hit != null) { openHit(+d.hit); return; }
    if (d.group) { closeDrawer(); return; }
    if (d.macro) { closeDrawer(); return; }
    if (d.tpl) { closeDrawer(); return; }
    if (d.file) { closeDrawer(); return; }
    if (d.sub) {
      /* the rail uses links (native navigation); the Review tabs are buttons */
      if (b.tagName === 'A') { closeDrawer(); return; }
      go({ view: 'review', sub: d.sub });
      return;
    }
    if (d.res) { closeDrawer(); return; }

    if (d.seg) { pickSegment(b); return; }
    if (d.tsub) {
      state.tsub = d.tsub;
      render();
      return;
    }
    if (d.step) {
      var keys = groupKeys(), i = keys.indexOf(state.group) + (+d.step);
      if (keys[i]) go({ view: 'rules', group: keys[i] });
      return;
    }
    if (d.act) {
      if (d.act === 'clear') { state.mode = 'any'; state.level = 'all'; state.group = firstGroup(); render(); }
      else if (d.act === 'clear-tpl') { state.tt = 'all'; state.te = 'all'; state.tl = 'all'; state.tpl = null; state.file = null; render(); }
      else if (d.act === 'copy-guide') { copy(guide(), b); }
      else if (d.act === 'dl-guide') { download('latex-rules.md', guide()); }
      else if (d.act === 'dl-zip') { downloadTemplateZip(); }
      else if (d.act === 'toggle-min') { toggleMin(); }
      else if (d.act === 'print') { window.print(); }
      else if (d.act === 'reset-checks') { state.done.clear(); persist(); render(); }
      else if (d.act === 'copy-example') { copy(b.dataset.text || '', b); }
      if (b.closest('.menu')) { var det = b.closest('.menu'); if (det) det.removeAttribute('open'); }
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.k) {
      state[t.dataset.k] = t.value;
      if (t.dataset.k === 'mode' || t.dataset.k === 'level') {
        state.group = (state.group && groupCounts()[state.group] && groupCounts()[state.group].on > 0) ? state.group : firstGroup();
      }
      if (t.dataset.k === 'tt' || t.dataset.k === 'te' || t.dataset.k === 'tl') { state.file = null; state.tpl = null; }
      render();
      return;
    }
    if (t.dataset && t.dataset.chk != null) {
      var i = +t.dataset.chk;
      if (t.checked) state.done.add(i); else state.done.delete(i);
      var total = document.querySelector('.chk-tools .meta');
      if (total) total.textContent = state.done.size + ' / ' + CK.length;
      tickChecklist();
      persist();
    }
  });

  var qi;
  $('q').addEventListener('input', function () {
    state.q = this.value.trim();
    clearTimeout(qi);
    qi = setTimeout(function () {
      if (!state.q) { closePanel(); return; }
      openPanel();
    }, 60);
  });
  $('q').addEventListener('focus', function () { if (state.q) openPanel(); });

  $('theme').addEventListener('click', function (e) {
    toggleTheme({ x: e.clientX, y: e.clientY });
  });
  $('menu').addEventListener('click', function () {
    if (drawerOpen) closeDrawer(); else openDrawer();
  });
  $('scrim').addEventListener('click', closeDrawer);

  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toUpperCase();
    var typing = tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA';
    var mod = e.ctrlKey || e.metaKey;

    if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); $('q').focus(); $('q').select(); return; }
    if (mod && e.key.toLowerCase() === 'e' && !typing) { e.preventDefault(); toggleTheme({}); return; }
    if (e.key === '/' && !typing) { e.preventDefault(); $('q').focus(); return; }

    if (panelOpen()) {
      if (e.key === 'ArrowDown') { e.preventDefault(); movePanel(1); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); movePanel(-1); return; }
      if (e.key === 'Enter') { e.preventDefault(); openHit(panelCur); return; }
      if (e.key === 'Escape') { e.preventDefault(); closePanel(); $('q').blur(); return; }
    }
    if (e.key === 'Escape') {
      if (drawerOpen) { closeDrawer(); return; }
      if (typing && e.target === $('q')) { $('q').value = ''; state.q = ''; closePanel(); $('q').blur(); }
      return;
    }
    if (typing || mod || e.altKey) return;

    if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') &&
        e.target.classList && e.target.classList.contains('seg-btn')) {
      e.preventDefault();
      var grp = e.target.closest('.seg');
      var opts2 = Array.prototype.slice.call(grp.querySelectorAll('.seg-btn'));
      var ni = (opts2.indexOf(e.target) + (e.key === 'ArrowRight' ? 1 : -1) + opts2.length) % opts2.length;
      opts2[ni].focus();
      pickSegment(opts2[ni]);
      return;
    }

    if (e.key === 'j' || e.key === 'k') {
      if (state.view !== 'rules') return;
      var items = SORTED.filter(function (x) { return x[0].split('-')[0] === state.group; }).filter(pass);
      if (!items.length) return;
      var cur = state.rule ? items.findIndex(function (x) { return x[0] === state.rule; }) : -1;
      var next = e.key === 'j' ? Math.min(items.length - 1, cur + 1) : Math.max(0, cur - 1);
      state.rule = items[next][0];
      pending = { id: items[next][0], flash: true };
      render();
      return;
    }
    if (e.key === 't') { toggleTheme({}); return; }
    if (e.key === 'g') { $('q').focus(); }
  });

  /* ---------- init ---------- */
  restore();
  applyMin();
  document.documentElement.classList.toggle('dark', state.theme === 'dark');
  if (state.rail) setRail(state.rail, false); else paintRail();
  syncThemeBtn();
  if (/Mac|iPhone|iPad/.test(navigator.platform)) { $('kbd').textContent = '⌘K'; }
  buildIndex();
  applyRoute(parseHash());
  render();
  addEventListener('load', function () {
    renderMath($('pane'));
    updateProgress();
  });
  addEventListener('resize', function () {
    if (innerWidth >= 900) closeDrawer();
    if (innerWidth >= 900 && state.rail) setRail(state.rail, true);
    else paintRail();
  });
})();

</script>
</body>
</html>
