:root{--bg:#FAF8F3;--fg:#1F2A44;--ac:#8C2F39;--card:#fff;--bd:#e4dfd2;--mut:#5f6678;--code:#f3efe4}
.dark{--bg:#0F1420;--fg:#E6E9F0;--ac:#D9A441;--card:#171d2d;--bd:#2a3350;--mut:#9aa4bd;--code:#0b0f19}
body{background:var(--bg);color:var(--fg);font-family:Inter,sans-serif}
h1,h2,h3{font-family:'Source Serif 4',serif}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px}
pre{background:var(--code);border:1px solid var(--bd);border-radius:6px;padding:10px;overflow-x:auto;font:12.5px/1.5 'JetBrains Mono',monospace;white-space:pre}
.btn{border:1px solid var(--bd);border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer;background:var(--card)}
.btn:hover,.btn.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.tag{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--bd)}
.bad{border-left:3px solid #c0392b}.good{border-left:3px solid #2e8b57}
input,select{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;color:var(--fg)}
nav{background:var(--bg);border-bottom:1px solid var(--bd)}
a.side{display:block;padding:3px 8px;font-size:14px;border-radius:6px}a.side:hover{background:var(--code)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ac);color:var(--bg);padding:8px 16px;border-radius:8px;display:none;z-index:50}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media print{nav,aside,.btn,footer{display:none}}
</style>
</head>

const CONV=r`- Packages: \usepackage[numbers]{natbib}, \bibliographystyle{ieeetr}, \usepackage[capitalize,nameinlink]{cleveref} loaded LAST. A refs.bib file must exist next to main.tex.

- Equations: cited => equation/align with \label. Not cited => equation*/align*/$$ (no label).
- Theorem environments (one shared counter): thm lem prop cor defi rem ex. Extended (commented out by default): claim conj axiom asm fact nota prob exer ques. Long names (theorem, lemma, definition...) stay commented. Never name an environment def, not or note. Use the proof environment for proofs.
- Label prefixes: thm lem prop cor defi rem ex eq fig tab claim conj axiom asm fact nota prob exer ques.
- Article labels: sec7, subsec7.2, <env>_sec<section>:<printed number> (prop_sec3:6), eq_sec3:2.

  SORTED.forEach(x=>{s+='- '+x[0]+' ['+LV[x[1]][0]+'; '+MD[x[2]]+'] '+x[3]+': '+x[4]+'\n  DONT: '+f(x[5])+'\n  DO: '+f(x[6])+'\n'});

function thms(l,m){
  const n=N[l],hw=m=='hw',bm=m=='bm';
  const pl=w=>l=='vi'?w:(w.endsWith('y')?w.slice(0,-1)+'ies':w+'s');
  const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
  const cd=(k,w,p)=>r`\crefname{${k}}{${cap(w)}}{${cap(p)}}\Crefname{${k}}{${cap(w)}}{${cap(p)}}`;
  const cn=k=>{const w=n[k].toLowerCase();return cd(k,w,pl(w))};
  const nt=k=>r`\newtheorem{${k}}[thm]{${n[k]}}`;
  let s='% --- Theorem-like environments (one shared counter) ---\n';
  if(hw)s+=r`\newtheorem{prob}{${T2(l,'Bài','Problem')}}`+'\n';
  if(!bm)s+=r`\theoremstyle{plain}`+'\n';
  s+=r`\newtheorem{thm}{${n.thm}}${hw?'[prob]':''}`+'\n';
  ['lem','prop','cor'].forEach(k=>s+=nt(k)+'\n');
  if(!bm)s+=r`\theoremstyle{definition}`+'\n';
  ['defi','ex'].forEach(k=>s+=nt(k)+'\n');
  if(!bm)s+=r`\theoremstyle{remark}`+'\n';
  s+=nt('rem')+'\n';
  if(!bm)s+=(hw?r`\numberwithin{equation}{prob}`:r`\numberwithin{thm}{section}`+'\n'+r`\numberwithin{equation}{section}`)+'\n';
  s+='\n% --- Reference names ---\n';
  s+=['thm','lem','prop','cor','defi','rem','ex'].map(cn).join('\n')+'\n';
  if(hw)s+=cd('prob',T2(l,'bài','problem'),T2(l,'bài','problems'))+'\n';
  if(vi(l))s+=[['section','mục'],['subsection','mục'],['chapter','chương'],['equation','công thức'],['figure','hình'],['table','bảng']].map(a=>cd(a[0],a[1],a[1])).join('\n')+'\n';
  if(!bm){
    s+='\n'+T2(l,'% --- Tên đầy đủ: bỏ % ở đầu dòng nếu muốn gõ \\begin{theorem} ---','% --- Long names: remove the leading % to type \\begin{theorem} ---')+'\n';
    ['thm','lem','prop','cor','defi','rem','ex'].forEach(k=>s+=r`%\newtheorem{${LONG[k]}}[thm]{${n[k]}}\crefalias{${LONG[k]}}{${k}}`+'\n');

  s+='\n'+T2(l,'% --- Môi trường mở rộng (đang tắt) ---','% --- Extended environments (disabled) ---')+'\n';

    if(LONG[k]&&LONG[k]!=k)s+=r`%\newtheorem{${LONG[k]}}[thm]{${n[k]}}\crefalias{${LONG[k]}}{${k}}`+'\n';
  });
  return s;
}

      :r`\usepackage[${v?'T5':'T1'}]{fontenc}`+'\n'+r`\usepackage[utf8]{inputenc}`+'\n'+r`\usepackage[${lg}]{babel}`;
  s+='\n\n'+r`\usepackage{amsmath,amssymb,mathtools,booktabs,graphicx}`+'\n';
  if(!bm)s+=r`\usepackage{amsthm,enumitem,etoolbox}`+'\n';
  if(hw)s+=r`\usepackage{environ}`+'\n';
  s+=r`%\usepackage{mymath}  % `+T2(l,'tùy chọn: xem tab Macro Pack','optional: see the Macro Pack tab')+'\n';
  s+=r`\usepackage[numbers]{natbib}`+'\n';

\setbeamertemplate{navigation symbols}{}
\setbeamertemplate{theorems}[numbered]
\setbeamertemplate{bibliography item}[text]`+'\n\n';
  s+=thms(l,t)+(bm?'% Beamer: enumerate[(a)] or [(i)] for lists\n':listcfg(l));

  return s+body(t,l);
}

function vRules(){
  const L=SORTED.filter(x=>(S.mode=='any'||x[2]==S.mode||x[2]=='all')&&(S.lvl=='all'||x[1]==S.lvl)&&hit(x));
  const gs=[...new Set(L.map(x=>x[0].split('-')[0]))];
  let h='<div class="flex flex-wrap gap-3 mb-4 items-center">'+flt('mode','Mode',[['any','All'],['art','Article'],['book','Book/Report'],['all','Common']])+flt('lvl','Level',[['all','All'],['R','🔴 Required'],['Y','🟡 Recommended'],['G','🟢 Optional']])+'<span class="text-sm" style="color:var(--mut)">'+L.length+' rules</span></div>';
  h+='<div class="grid lg:grid-cols-[200px_1fr] gap-6"><aside class="flex flex-wrap gap-1 lg:block lg:sticky lg:top-16 lg:self-start">'+gs.map(g=>'<a class="side" href="#g-'+g+'">'+GR[g]+'</a>').join('')+'</aside><div>';
  let cur='';
  L.forEach(x=>{
    const g=x[0].split('-')[0];
    if(g!=cur){cur=g;h+='<h2 id="g-'+g+'" class="text-2xl mt-6 mb-3" style="scroll-margin-top:70px">'+GR[g]+'</h2>';}
    h+='<article id="'+x[0]+'" class="card mb-4" style="scroll-margin-top:70px"><div class="flex flex-wrap items-center gap-2"><code class="font-bold" style="color:var(--ac)">'+x[0]+'</code><span class="tag">'+LV[x[1]][1]+' '+LV[x[1]][0]+'</span><span class="tag">'+MD[x[2]]+'</span><h3 class="font-semibold text-lg">'+esc(x[3])+'</h3></div>'
    +'<p class="my-2 text-sm" style="color:var(--mut)">'+esc(x[4])+'</p><div class="grid md:grid-cols-2 gap-3"><div><b class="text-xs">✗ Don\'t</b><pre class="bad">'+esc(x[5])+'</pre></div><div><b class="text-xs">✓ Do</b><pre class="good">'+esc(x[6])+'</pre></div></div>'

  });
  return h+(L.length?'':'<p>No rule matches.</p>')+'</div></div>';
}
function vMacros(){

  return h;
}

  const sel=TPL.find(x=>x.id==S.sel);

    h+='<div class="card mb-4"><h3 class="text-xl mb-1">'+sel.title+'</h3><p class="text-sm mb-2" style="color:var(--mut)">'+esc(sel.desc)+'</p>';
    if(!sel.nobib)h+='<div class="p-2 mb-2 text-sm" style="border:1px solid var(--ac);border-radius:6px"><b>Create refs.bib.</b> Every template uses natbib + ieeetr, so put a <code>refs.bib</code> file in the same folder, cite with <code>\\cite{key}</code>, and run bibtex ('+en+' → bibtex → '+en+' ×2).</div><div class="flex flex-wrap gap-2 mb-3">'+cp(BIB,'Copy sample refs.bib')+dl('refs.bib',BIB)+'</div>';
    if(sel.guide)h+='<h4 class="font-semibold mb-1">How to use</h4><ol class="list-decimal pl-5 text-sm mb-3 space-y-1">'+sel.guide.map(g=>'<li>'+g+'</li>').join('')+'</ol>';
    if(sel.example)h+='<h4 class="font-semibold mb-1">Example questions</h4><div class="flex gap-2 mb-1">'+cp(sel.example,'Copy example')+'</div><pre class="mb-3">'+esc(sel.example)+'</pre>';
    sel.files.forEach(f=>{h+='<div class="flex flex-wrap items-center gap-2 mt-3 mb-1"><code class="font-bold" style="color:var(--ac)">'+f.n+'</code>'+cp(f.c,'Copy')+dl(f.n,f.c)+'</div><pre style="max-height:420px">'+esc(f.c)+'</pre>'});
    h+='</div>';
  }
  h+='<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">'+L.map(x=>'<button class="card text-left '+(x.id==S.sel?'ring-2':'')+'" data-sel="'+x.id+'" style="'+(x.id==S.sel?'border-color:var(--ac)':'')+'"><b>'+x.title+'</b><div class="text-xs mt-1" style="color:var(--mut)">'+esc(x.desc)+'</div>'+(x.files.length>1?'<div class="text-xs mt-1">'+x.files.length+' files</div>':'')+'</button>').join('')+'</div>';
  return h;
}
function render(){
  store=[];
  $('#tabs').innerHTML=[['rules','Rules','fa-scale-balanced'],['macros','Macro Pack','fa-code'],['tpl','Templates','fa-file-lines'],['check','Pitfalls & Checklist','fa-list-check'],['ai','AI Prompt','fa-robot']].map(t=>'<button class="btn '+(S.tab==t[0]?'on':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>').join('');
  $('#main').innerHTML=({rules:vRules,macros:vMacros,tpl:vTpl,check:vCheck,ai:vAI})[S.tab]();
  document.querySelectorAll('[data-tex]').forEach(e=>{try{katex.render(e.dataset.tex,e,{throwOnError:false,macros:Object.assign({},KM)})}catch(_){e.textContent=e.dataset.tex}});
}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1400)}
function copy(t){
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t).then(()=>toast('Copied!'),()=>fb(t));
  fb(t);
}
function fb(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copied!')}catch(_){toast('Copy failed')}a.remove()}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){S.tab=b.dataset.tab;render()}
  else if(b.dataset.copy)copy(store[b.dataset.copy]);
  else if(b.dataset.dl){const u=URL.createObjectURL(new Blob([store[b.dataset.dl]],{type:'text/plain'}));const a=document.createElement('a');a.href=u;a.download=b.dataset.name;a.click();URL.revokeObjectURL(u)}
  else if(b.dataset.link)copy(location.href.split('#')[0]+'#'+b.dataset.link);
  else if(b.dataset.sel){S.sel=b.dataset.sel;render();window.scrollTo({top:0,behavior:'smooth'})}
});
document.addEventListener('change',e=>{if(e.target.dataset.k){S[e.target.dataset.k]=e.target.value;render()}});
$('#q').addEventListener('input',e=>{S.q=e.target.value.toLowerCase().trim();render()});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key=='k'||(e.key=='/'&&!/INPUT|SELECT/.test(document.activeElement.tagName))){e.preventDefault();$('#q').focus()}
});
$('#th').addEventListener('click',()=>{const d=document.documentElement.classList.toggle('dark');try{localStorage.setItem('th',d?'d':'l')}catch(_){}});
(function(){let d=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;try{const v=localStorage.getItem('th');if(v)d=v=='d'}catch(_){}document.documentElement.classList.toggle('dark',d)})();
window.addEventListener('load',()=>{render();if(location.hash){const el=document.getElementById(location.hash.slice(1));if(el)el.scrollIntoView()}});
</script>
</body>
</html>
